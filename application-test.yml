spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cloud:
    openfeign:
      client:
        config:
          product-service:
            url: http://product-service:8080
          user-service:
            url: http://user-service:8081